#slidomingo-splash{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:24px;background:radial-gradient(130% 90% at 50% 38%,#2c200c 0%,#17120a 58%,#0c0905 100%);pointer-events:none;transition:opacity .5s ease;animation:bsAuto .6s ease 9s both}
#slidomingo-splash.done{opacity:0}
.bs-mark{position:relative;width:104px;height:104px;border-radius:23px;box-shadow:0 0 60px rgba(255,194,51,.2),0 10px 34px rgba(0,0,0,.55);overflow:hidden;animation:bsIn .45s cubic-bezier(.22,1.4,.36,1) both,bsFloat 3.4s ease-in-out 1.4s infinite}
.bs-mark svg{display:block;width:104px;height:104px}
.bs-mark:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.22) 50%,transparent 62%);transform:translateX(-130%);animation:bsSheen .9s ease 1.05s both}
.bs-mark .sm-disc,.bs-mark .sm-bee,.bs-mark .sm-arm,.bs-mark .sm-pulse circle{transform-box:view-box}
.bs-mark .sm-disc{animation:bsSpin 1.8s linear .2s infinite}
.bs-mark .sm-bee{animation:bsFly .45s cubic-bezier(.3,.7,.4,1) .35s both}
.bs-mark .sm-arm{animation:bsDrop .2s cubic-bezier(.3,1.6,.5,1) .8s both}
.bs-mark .sm-wings{transform-box:fill-box;transform-origin:50% 40%;animation:bsFlap .08s ease-in-out .35s infinite alternate}
.bs-mark .sm-pulse circle{opacity:0;animation:bsPulse 1.2s ease-out 1s infinite}
.bs-mark .sm-pulse circle+circle{animation-delay:1.12s}
.bs-word{font:600 22px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#ffc233;letter-spacing:-.01em;animation:bsUp .5s ease .55s both}

.bs-bar i{display:block;width:44%;height:100%;border-radius:1px;background:linear-gradient(90deg,#ff4d6d,#ff9f1c,#ffe14d,#4cd97b,#3fa9f5,#8e6cff);animation:bsScan 1.1s cubic-bezier(.45,0,.55,1) .9s infinite alternate}
@keyframes bsIn{from{transform:scale(.55) rotate(-8deg);opacity:0}}
@keyframes bsSpin{to{transform:rotate(360deg)}}
@keyframes bsFly{0%{opacity:0;transform:translate(11px,-13px) rotate(-30deg) scale(.5)}35%{opacity:1}60%{transform:translate(3px,-5px) rotate(-8deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes bsDrop{from{transform:rotate(-13deg)}to{transform:none}}
@keyframes bsFlap{to{transform:scale(.72,.8)}}
@keyframes bsPulse{0%{opacity:.9;transform:scale(.25)}to{opacity:0;transform:scale(1.9)}}
@keyframes bsSheen{to{transform:translateX(130%)}}
@keyframes bsFloat{50%{transform:translateY(-5px)}}
@keyframes bsUp{from{opacity:0;transform:translateY(10px)}}
@keyframes bsScan{from{transform:translateX(-30%)}to{transform:translateX(210%)}}
@keyframes bsAuto{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#slidomingo-splash,#slidomingo-splash *,.bs-mark:after{animation-duration:.01ms;animation-delay:0ms;animation-iteration-count:1}}

    <script>
(async () => {
  var fail = function (msg) {
    var d = document.createElement('div')
    d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0D1B2E;color:#F2F0EA;font:16px/1.6 sans-serif;text-align:center;padding:40px;z-index:99999'
    d.innerHTML = msg
    document.body.appendChild(d)
    var s = document.getElementById('slidomingo-splash'); if (s) s.remove()
  }
  if (typeof DecompressionStream === 'undefined') {
    // The old text said "2023 or later" and then listed Chrome 80, which is
    // 2020 — a reader checking their version against it learns nothing. It also
    // never said what kind of file this is, and never mentioned that the data
    // is plain readable JSON in this same file, which is the one route out that
    // works with no capable browser at all.
    fail('<b>This is a slidomingo/dash spreadsheet.</b><br>Opening it needs a browser released in 2023 or later \u2014 Safari 16.4+, Firefox 113+, or a current Chrome or Edge.<br><br>Nothing is lost: your data is stored as plain readable JSON inside this same file. Open it in a newer browser, or open it in a text editor and look for the block marked "slidomingo-doc".')
    return
  }
  var inflate = async function (id) {
    var b64 = document.getElementById(id).textContent.trim()
    var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0) })
    var ds = new DecompressionStream('deflate-raw')
    var stream = new Blob([bytes]).stream().pipeThrough(ds)
    return await new Response(stream).text()
  }
  try {
    var css = await inflate('slidomingo-rt-css')
    // drop stale plaintext copies (see TRANSIENT DOM above), then inject ours
    var old = document.querySelectorAll('style')
    for (var i = 0; i < old.length; i++) {
      if (old[i].hasAttribute('data-slidomingo-transient') || old[i].textContent === css) old[i].remove()
    }
    var st = document.createElement('style')
    st.id = 'slidomingo-rt-style'
    st.setAttribute('data-slidomingo-transient', '')
    st.textContent = css
    document.head.appendChild(st)
    var js = await inflate('slidomingo-rt')
    var url = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }))
    await import(url)
  } catch (e) {
    fail('This file could not start: ' + (e && e.message ? e.message : e))
  }
})()
</script>
