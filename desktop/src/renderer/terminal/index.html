<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Claude Code</title>
    <link rel="stylesheet" href="./terminal.css" />
  </head>
  <body>
    <div id="term-resizer" class="term-resizer" title="Drag to resize"></div>
    <div id="term-header" class="term-header">
      <div class="term-bar">
        <!-- The chat switcher: the shown chat's title; opens the Chats menu
             (main.ts openHistory) — the chats open here, then this deck's
             earlier conversations from main's chathistory.ts. -->
        <button id="term-history" class="term-switcher" title="Open and earlier chats" aria-haspopup="menu" aria-expanded="false">
          <span id="term-switcher-dot" class="term-tab-dot"></span>
          <span id="term-switcher-title" class="term-switcher-title">Claude</span>
          <svg class="term-switcher-caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="term-actions">
          <!-- Icons match slides/src/icons.ts's lucide-style set (16x16, stroke
               currentColor, stroke-width 2, round caps) — duplicated inline
               since this renderer shares no bundle with slides/. -->
          <!-- Split button: + = new chat with the default AI profile, caret = pick a profile. -->
          <div class="term-split">
            <button id="term-new-tab" class="term-actionbtn term-split-main" title="New chat (default profile)">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="term-actionlabel">New</span>
            </button>
            <button id="term-new-menu" class="term-actionbtn term-split-caret" title="New chat with…" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
          <button id="term-folders" class="term-actionbtn" title="Folders the AI chats of this deck can read" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span id="term-folders-count" class="term-actionlabel term-count" hidden></span>
          </button>
          <span class="term-sep" aria-hidden="true"></span>
          <!-- Only one of these shows, by html[data-mode] (terminal:init). -->
          <button id="term-popout" class="term-actionbtn" title="Pop out into its own window">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
          <button id="term-dock" class="term-actionbtn" title="Dock back into the document window">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/><polyline points="8 9 11 12 8 15"/></svg>
          </button>
          <button id="term-close" class="term-actionbtn" title="Close the panel (all chats)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <!-- One .term-tab per open parallel `claude` session (tab), built by
           main.ts from terminal:init / the "+" button's result — see
           desktop/src/main/terminalPanel.ts's SessionState. Shown once two
           or more chats are open. -->
      <div id="term-tabs-wrap" class="term-tabs-wrap">
        <div id="term-tabs" class="term-tabs" role="tablist"></div>
      </div>
    </div>
    <!-- The history menu (main.ts openHistory): this deck's earlier
         conversations, from main's chathistory.ts. -->
    <div id="term-history-menu" class="term-history" role="menu" hidden></div>
    <div id="term-profile-menu" class="term-history" role="menu" hidden></div>
    <div id="term-folders-menu" class="term-history" role="menu" hidden></div>
    <div id="term-container"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
